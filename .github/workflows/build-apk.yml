name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk IELTS-MasterSpeak.apk
          ls -la IELTS-MasterSpeak.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IELTS-MasterSpeak-apk
          path: IELTS-MasterSpeak.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "IELTS MasterSpeak v1.0 (Android APK)"
          body: |
            ### 📱 IELTS MasterSpeak - Standalone Android Mobile App (.apk)
            
            Optimized for **Xiaomi Redmi Note 13 (Android 13 / MIUI 14)**.
            
            #### 🚀 Highlights:
            - **100% Standalone**: No computer, no laptop, no local server or browser required. Run anywhere on 4G / Wi-Fi.
            - **Google Gemini 3.5 Flash Active**: Instant Cambridge AI feedback, Band 9 rewrites, vocabulary upgrades.
            - **Examiner Audio & Mock Exams**: Full voice recording with MIUI haptic feedback and safe area layout.
            
            #### 📥 Installation on Redmi Note 13:
            1. Tap the `IELTS-MasterSpeak.apk` download link below.
            2. Open the downloaded file and tap **Install**.
            3. If MIUI warns about unknown apps, toggle **Allow from this source**.
            4. Launch and start practicing!
          files: IELTS-MasterSpeak.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
